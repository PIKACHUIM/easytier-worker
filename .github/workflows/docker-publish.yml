name: Build & Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名称自动取自仓库所有者/仓库名
  APP_IMAGE: ghcr.io/${{ github.repository }}/app
  MONITOR_IMAGE: ghcr.io/${{ github.repository }}/monitor

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 QEMU（支持多平台构建）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── App 镜像 ──────────────────────────────────────────────

      - name: Extract metadata for app image
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # ── Monitor 镜像 ──────────────────────────────────────────

      - name: Extract metadata for monitor image
        id: monitor-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MONITOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push monitor image
        uses: docker/build-push-action@v6
        with:
          context: ./monitor
          file: ./monitor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.monitor-meta.outputs.tags }}
          labels: ${{ steps.monitor-meta.outputs.labels }}
          cache-from: type=gha,scope=monitor
          cache-to: type=gha,mode=max,scope=monitor
