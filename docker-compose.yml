services:
  # Hono 前后端服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easytier-app
    ports:
      - "8787:8787"
    environment:
      # JWT_SECRET 可选：不设置则容器启动时自动随机生成并持久化
      JWT_SECRET: ${JWT_SECRET:-}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-false}
      SITE_NAME: ${SITE_NAME:-EasyTier 节点管理系统}
    volumes:
      # 持久化 wrangler 本地状态（D1 本地数据库等）
      - wrangler_state:/app/.wrangler
      # 共享 secrets 目录（JWT_SECRET 由 app 写入，monitor 读取）
      - secrets_vol:/secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Monitor 监控服务
  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    container_name: easytier-monitor
    depends_on:
      app:
        condition: service_healthy
    environment:
      # 指向容器内部的 app 服务
      API_URL: http://app:8787
      LOG_LEVEL: ${MONITOR_LOG_LEVEL:-INFO}
    volumes:
      # 读取 app 写入的 JWT_SECRET
      - secrets_vol:/secrets:ro
      # 如需使用 Linux checker 可执行文件，通过 volume 挂载
      - ./monitor/checker:/monitor/checker:ro
    restart: unless-stopped

volumes:
  # wrangler 本地 D1 数据库持久化
  wrangler_state:
  # app 与 monitor 共享的 secrets（JWT_SECRET）
  secrets_vol:
